name: Fallow

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  fallow:
    name: Audit changed code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fallow audit
        uses: fallow-rs/fallow@c2da9fcae5388226a87e986b1812f9c872d288c6 # v3.24.1
        with:
          command: audit
          gate: new-only
          fail-on-issues: true
          annotations: true
