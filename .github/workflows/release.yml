name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semver version without v prefix (e.g. 0.2.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: catlex-release
  cancel-in-progress: false

jobs:
  # Runs repository and dependency code, so it must never hold write access or
  # the OIDC identity used to sign attestations.
  build:
    name: Build release assets
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Ensure main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Release workflow can only run from the main branch (got ${{ github.ref }})."
          exit 1

      - name: Validate version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${INPUT_VERSION#v}"
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semver version: ${INPUT_VERSION}"
            exit 1
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Validate project before release
        run: |
          bun run check
          bun run typecheck
          bun run test
          bun audit
          BASE_REF="$(git describe --tags --abbrev=0 HEAD 2>/dev/null || git rev-list --max-parents=0 HEAD)"
          bun run fallow -- audit --base "$BASE_REF" --format json --quiet --explain --gate-marker agent

      - name: Bump version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          bun -e "
            const pkg = await Bun.file('package.json').json();
            pkg.version = process.env.VERSION;
            await Bun.write('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Build standalone binaries
        run: bun run build:all

      - name: Prepare release assets
        run: |
          cp dist/catlex-linux-x64 catlex-linux-x64
          cp dist/catlex-linux-arm64 catlex-linux-arm64
          cp dist/catlex-darwin-x64 catlex-darwin-x64
          cp dist/catlex-darwin-arm64 catlex-darwin-arm64
          cp dist/catlex-windows-x64.exe catlex-windows-x64.exe
          chmod +x catlex-linux-x64 catlex-linux-arm64 catlex-darwin-x64 catlex-darwin-arm64
          cp scripts/install.sh install.sh
          cp scripts/install.ps1 install.ps1
          chmod +x install.sh
          sha256sum catlex-linux-x64 catlex-linux-arm64 catlex-darwin-x64 catlex-darwin-arm64 catlex-windows-x64.exe install.sh install.ps1 > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Smoke test release binary
        run: bun run smoke -- ./catlex-linux-x64

      - name: Upload release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: |
            catlex-linux-x64
            catlex-linux-arm64
            catlex-darwin-x64
            catlex-darwin-arm64
            catlex-windows-x64.exe
            install.sh
            install.ps1
            SHA256SUMS
          if-no-files-found: error
          retention-days: 1

  # Holds write access and the signing identity, so it must not run repository
  # or dependency code: no Bun, no package scripts, and no executed assets.
  publish:
    name: Attest and publish release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release-assets

      - name: Verify release assets
        working-directory: release-assets
        run: sha256sum --check SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-assets/*

      - name: Bump version
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          jq --arg version "${VERSION}" '.version = $version' package.json > package.json.tmp
          mv package.json.tmp package.json

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit, tag and push
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          git add package.json
          git commit -m "chore: release ${TAG}"
          git tag "${TAG}"
          git push origin HEAD:main
          git push origin "${TAG}"

      - name: Create GitHub Release
        working-directory: release-assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          gh release create "${TAG}" \
            catlex-linux-x64 \
            catlex-linux-arm64 \
            catlex-darwin-x64 \
            catlex-darwin-arm64 \
            catlex-windows-x64.exe \
            install.sh \
            install.ps1 \
            SHA256SUMS \
            --title "${TAG}" \
            --notes "$(cat <<EOF
          ## Install

          ### Linux / macOS

          \`\`\`bash
          curl -fsSL https://github.com/${{ github.repository }}/releases/latest/download/install.sh | bash
          \`\`\`

          Installs the binary to \`~/.local/bin/catlex\`.

          To install a specific version (recommended for CI; verifies SHA256SUMS):

          \`\`\`bash
          curl -fsSL https://github.com/${{ github.repository }}/releases/download/${TAG}/install.sh | CATLEX_VERSION=${VERSION} bash
          \`\`\`

          ### Windows (x64)

          \`\`\`powershell
          irm https://github.com/${{ github.repository }}/releases/latest/download/install.ps1 | iex
          \`\`\`

          Installs the binary to \`%LOCALAPPDATA%\\catlex\\bin\\catlex.exe\`.

          To install a specific version (recommended for CI; verifies SHA256SUMS):

          \`\`\`powershell
          \$env:CATLEX_VERSION='${VERSION}'; irm https://github.com/${{ github.repository }}/releases/download/${TAG}/install.ps1 | iex
          \`\`\`

          ## Verify provenance

          Every asset has a signed build provenance attestation. Check a downloaded file with the GitHub CLI:

          \`\`\`bash
          gh attestation verify catlex-linux-x64 --repo ${{ github.repository }} --signer-workflow ${{ github.repository }}/.github/workflows/release.yml
          \`\`\`
          EOF
          )"
